<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f7d9a8">
<title>시바견 카페</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E🐕%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="res coin"><span class="ico">🪙</span><b id="coins">0</b></div>
    <div class="res"><span class="ico">⭐</span><b id="rep">0</b></div>
    <div class="res"><span class="ico">▶️</span><b id="subs">0</b></div>
    <div class="ips"><b id="ips">0</b>/초</div>
  </header>

  <section id="room">
    <div class="wall">
      <div class="sign">🐾 동구네 시바 카페</div>
      <div class="window"></div>
      <div id="boss" title="사장님 동구"></div>
    </div>
    <div class="floor" id="floor"></div>
    <div id="fx"></div>
    <button id="boostBtn" class="boost">📺 광고 보고 2배</button>
    <div id="boostTimer" class="boost-timer hidden"></div>
    <div id="toast" class="toast hidden"></div>
  </section>

  <nav id="tabs">
    <button data-tab="cafe" class="on">☕<span>카페</span></button>
    <button data-tab="train">🎓<span>교육</span></button>
    <button data-tab="walk">🦮<span>산책</span></button>
    <button data-tab="yt">🎬<span>유튜브</span></button>
    <button data-tab="book">📖<span>도감</span></button>
  </nav>
  <section id="panel"></section>
</div>

<div id="modal" class="modal hidden"><div class="card" id="modalCard"></div></div>
<div id="ad" class="ad hidden"><div class="ad-box"><div class="ad-tag">광고 (테스트)</div><div class="ad-dog">🐕</div><p>광고 시청 중…</p><b id="adCount">3</b></div></div>
<div id="debug" class="hidden"></div>
<script src="game.js"></script>
</body>
</html>
