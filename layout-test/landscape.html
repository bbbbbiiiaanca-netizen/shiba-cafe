<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>시바견 카페 · 가로 화면</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="common.css">
<style>
:root{--k:1}
.screen{position:fixed;left:0;top:0;width:100%;height:100%;height:100dvh;overflow:hidden;background:#2b1d12;touch-action:none}
.world{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0}
.world img{display:block;width:1280px;height:720px;-webkit-user-drag:none;pointer-events:none}
.tl,.tr,.side,.sign{position:absolute;transform:scale(var(--k))}
.tl{left:calc(env(safe-area-inset-left) + 14px);top:calc(env(safe-area-inset-top) + 8px);transform-origin:0 0}
.tr{right:calc(env(safe-area-inset-right) + 14px);top:calc(env(safe-area-inset-top) + 8px);transform-origin:100% 0}
.cur{display:flex;gap:8px}.cur .pill{width:118px}
.side{left:calc(env(safe-area-inset-left) + 14px);top:calc(env(safe-area-inset-top) + 8px + 42px*var(--k));transform-origin:0 0;display:flex;flex-direction:column;gap:7px}
.side .btn{width:56px;height:56px;font-size:11px}
.sign{left:calc(env(safe-area-inset-left) + 14px + 74px*var(--k));top:calc(env(safe-area-inset-top) + 70px*var(--k));width:96px;padding:8px 4px;font-size:22px;transform-origin:0 0}
.sign .paw{font-size:14px}
.rotate{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(43,29,18,.72)}
.rotate.show{display:flex}
.rotate .card{background:#f6ead2;border:3px solid #c9a77a;border-radius:20px;box-shadow:0 4px 0 #8a6440,0 8px 20px rgba(0,0,0,.4);padding:26px 30px 22px;text-align:center;font-size:20px}
.phone{width:34px;height:58px;border:4px solid #4a2e1a;border-radius:8px;margin:6px auto 22px;position:relative;animation:lt-rot 2.4s ease-in-out infinite}
.phone:after{content:'';position:absolute;left:50%;bottom:4px;width:10px;height:3px;margin-left:-5px;border-radius:2px;background:#4a2e1a}
@keyframes lt-rot{0%,20%{transform:rotate(0)}55%,80%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
.rotate small{display:block;margin-top:8px;font-size:12px;color:#8a6440}
</style></head><body>
<div class="screen" id="screen">
  <div class="world" id="world"><img src="scene.jpg" alt="" draggable="false"></div>
  <div class="tl"><div class="quest" id="quest"></div></div>
  <div class="tr"><div class="cur" id="cur"></div></div>
  <div class="side" id="side"></div>
  <div class="sign" id="sign"></div>
</div>
<div class="rotate" id="rotate"><div class="card"><div class="phone"></div>폰을 가로로 돌려주세요<small>(탭하면 그냥 볼 수 있어요)</small></div></div>
<script src="shared.js"></script>
<script>
(function () {
  'use strict';
  var world = document.getElementById('world');
  var screenEl = document.getElementById('screen');

  function fit() {
    var vw = window.innerWidth, vh = window.innerHeight;
    var s = Math.max(vw / LT.W, vh / LT.H);
    world.style.transform = 'translate(' + ((vw - LT.W * s) / 2) + 'px,' + ((vh - LT.H * s) / 2) + 'px) scale(' + s + ')';
    world.style.setProperty('--fx', (24 / s) + 'px');
    var k = Math.min(vw / 844, vh / 390);
    document.documentElement.style.setProperty('--k', Math.max(0.7, Math.min(1.6, k)));
  }
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', fit);
  fit();

  LT.mountHud();
  var btns = LT.renderButtons(document.getElementById('side'));
  btns.shibas.classList.add('on');
  LT.ambient(world);
  LT.bindTap(screenEl, function (e) {
    if (e.target.closest && e.target.closest('.btn,.pill,.quest,.sign')) return;
    LT.tap(e.clientX, e.clientY);
  });

  var rotate = document.getElementById('rotate');
  var mq = window.matchMedia('(orientation: portrait)');
  var dismissed = false;
  function upd() {
    if (!mq.matches) dismissed = false;
    rotate.classList.toggle('show', mq.matches && !dismissed);
  }
  if (mq.addEventListener) mq.addEventListener('change', upd); else mq.addListener(upd);
  rotate.addEventListener('click', function () { dismissed = true; upd(); });
  upd();
})();
</script>
</body></html>
