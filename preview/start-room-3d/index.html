<style>
[hidden]{display:none!important}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#3b2618;font-family:"Noto Sans CJK KR","Apple SD Gothic Neo",sans-serif;color:#4a2e1c;-webkit-user-select:none;user-select:none}
#frame{position:fixed;inset:0;border:5px solid #4a2e1c;border-radius:22px;overflow:hidden;background:#f3e3c4}

#bagBtn{position:absolute;left:8px;top:8px;background:#fffaf0;color:#4a2e1c;border:2px solid #e3c9a3;box-shadow:none;padding:2px 6px;font-size:14px;z-index:6}#heartPlus{cursor:pointer}.row .icon{font-size:30px;width:44px;text-align:center}
#csign{position:absolute;left:12px;top:96px;z-index:4;background:linear-gradient(#8a5a36,#6b4126);color:#fff3dc;border:2px solid #4a2e1c;border-radius:8px;padding:5px 8px;font-weight:900;font-size:13px;text-align:center;line-height:1.2;box-shadow:0 3px 4px rgba(0,0,0,.25)}

.bar button b{font-size:20px;line-height:1.1}.bar button.on{background:#ffd98a}.bar button.hl{animation:hl .9s infinite alternate}@keyframes hl{to{background:#ffbf47;transform:translateY(-3px)}}
#qdot{position:absolute;top:2px;right:6px;width:9px;height:9px;border-radius:5px;background:#e45b4f}

#panel.on{transform:translateY(0)}#panel h3{margin:0 0 6px;font-size:19px}#pclose{position:absolute;right:12px;top:10px;background:#c99563;box-shadow:none;padding:4px 10px}

.sub{font-size:13px;color:#8a6a50;margin:2px 0 8px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.card{background:#f6e6cf;border-radius:12px;text-align:center;padding:4px 2px;font-size:10px}.card img{width:100%;aspect-ratio:1;object-fit:contain;display:block}.card b{display:block}.card i{display:block;font-style:normal;color:#8a6a50}
.card.off{opacity:.55}.card.off img{filter:brightness(0) opacity(.25)}
.row{display:flex;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px solid #ecd9bd}.row b{flex:1;font-size:15px}.row i{font-style:normal;font-size:13px}.row img{width:44px;height:44px;object-fit:contain}.sw{width:18px;height:18px;border-radius:5px;border:1px solid #a8703f}
h4{margin:10px 0 2px}.big{display:block;width:100%;background:#5aa65a;box-shadow:0 3px 0 #3c7a3c;font-size:17px;padding:12px 0;border-radius:16px;margin:4px 0 10px}
#gacha{position:fixed;inset:0;background:#000;z-index:20;display:none}#gacha.on{display:block}
#gvid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#revealImg{position:absolute;left:50%;top:40%;width:min(70vw,290px);transform:translate(-50%,-50%) scale(.01);opacity:0;pointer-events:none;filter:drop-shadow(0 0 18px rgba(255,240,190,.95))}
#revealImg.on{animation:pop .5s cubic-bezier(.2,1.6,.4,1) forwards}@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.1)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
#gcard{position:absolute;left:20px;right:20px;bottom:40px;background:#fff8ec;border:3px solid #a8703f;border-radius:18px;padding:12px;text-align:center}
#gskip{position:absolute;right:12px;top:12px;background:rgba(0,0,0,.35);box-shadow:none}
#pops{position:absolute;inset:0;pointer-events:none;z-index:4}.pop{position:absolute;transform:translate(-50%,-50%);font-weight:900;font-size:16px;color:#7a4a10;text-shadow:0 0 3px #fff,0 0 6px #fff;animation:up 1.6s forwards}@keyframes up{to{transform:translate(-50%,-180%);opacity:0}}
#gpull{position:fixed;inset:0;z-index:15;background:#f6e2c4;display:none;flex-direction:column;align-items:center}#gpull.on{display:flex}
.gpTop{display:flex;gap:6px;align-items:center;margin:12px;padding:8px 10px;background:#fff6e6;border:2px solid #d9b48a;border-radius:22px;align-self:stretch}.ic{background:#f6e6cf;color:#4a2e1c;box-shadow:none;padding:4px 9px;font-size:16px}.pill{font-weight:800}
#gpull h2{margin:4px 0 6px;font-size:24px;color:#6a3f20}.mach{flex:1;min-height:0;max-width:92%;object-fit:cover;border-radius:24px;box-shadow:0 6px 16px rgba(90,50,20,.25)}
.gpBtns{display:flex;gap:10px;align-self:stretch;margin:14px 14px 22px}.gpBtns button{flex:1;background:#5aa65a;box-shadow:0 3px 0 #3c7a3c;font-size:17px;padding:14px 0;border-radius:18px}.gpBtns button:disabled{background:#a9c2a2;box-shadow:none}
.rc{border-radius:14px;padding:6px;background:#fff8ec;border:4px solid #ecd6b0;text-align:center;position:relative}.rc img{width:110px;height:110px;object-fit:contain;display:block;margin:0 auto}.rc b{display:block;font-size:15px}.rc i{font-style:normal;font-size:12px;color:#8a6a50}
.rc.N{border-color:#e4e4e4;background:#fff}.rc.R{border-color:#6f9fd6;background:#eef4fb}.rc.S{border:4px double #d4a437;background:linear-gradient(#fff6d8,#fbe6a6);box-shadow:0 0 0 2px #f3d27a}
.rgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:8px}.rgrid .rc{padding:2px;border-width:3px}.rgrid .rc img{width:100%;height:auto;aspect-ratio:1}.rgrid .rc b{font-size:9px}.rgrid .rc i{font-size:8px}
.row.sel{background:#ffe9b8;border-radius:10px}.row{flex-wrap:wrap}.walkopts{order:9;flex-basis:100%;display:flex;gap:6px}.walkopts button{flex:1;padding:6px 2px}.row .selk{color:#b8742a;font-weight:800;min-width:28px}
#promo{position:fixed;inset:0;z-index:25;background:rgba(40,25,10,.6);display:flex;align-items:center;justify-content:center}

.obd b{font-size:11px}.obd span{font-size:11px;flex:1}.obd.claimable{background:#ffd98a;box-shadow:0 2px 0 #c9975a}.obd.claimed{opacity:.55}.obd:disabled{background:#f1e4d0}.obd.claimable:disabled{background:#ffd98a}
#pullCap{width:auto;align-self:stretch;margin:0 14px 18px}

#langList,.langs{display:flex;flex-direction:column;gap:8px;align-self:stretch}#langList button,.langs button{background:#fff8ec;color:#4a2e1c;border:2px solid #e3c08a;box-shadow:none;padding:12px;font-size:17px}#langList button.on,.langs button.on{background:#ffd98a;border-color:#c9975a}#langOk{align-self:stretch}
#obs{position:absolute;left:46%;top:44%;z-index:4;font-size:30px;background:rgba(255,250,235,.7);border-radius:50%;box-shadow:0 0 12px #fff3b0;padding:6px 9px;animation:hl .9s infinite alternate}
#gcard>.rc{width:160px;margin:0 auto 8px}
