<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"><link rel="icon" href="data:,"><title>시바카페</title>
<style>
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#3b2618;font-family:"Noto Sans CJK KR","Apple SD Gothic Neo",sans-serif;color:#4a2e1c;-webkit-user-select:none;user-select:none}
#app{position:fixed;inset:0;max-width:430px;margin:0 auto;background:#f3e3c4;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;font-weight:800;border:0;border-radius:12px;background:#f0a64a;color:#fff;padding:7px 10px;box-shadow:0 2px 0 #b8742a;cursor:pointer}
button:disabled{background:#d6c7b3;color:#8a7763;box-shadow:0 2px 0 #b3a28c;cursor:default}
button.sec{background:#fffaf0;color:#6b4426;border:2px solid #e3c9a3;box-shadow:none}
button.warn{background:#d9695a;box-shadow:0 2px 0 #9c4136}
.ico{display:inline-block;width:22px;height:22px;border-radius:6px;background-image:url(assets/drive/icons-final-check.jpg);background-size:500% 100%;vertical-align:middle;flex:none}
.ico.reset{background-position:0 0}.ico.heart{background-position:25% 0}.ico.paw{background-position:50% 0}.ico.dia{background-position:75% 0}
.slot{display:inline-flex;align-items:center;justify-content:center;border:2px dashed #b99a74;border-radius:8px;color:#9b7b57;font-size:9px;font-weight:700;text-align:center;line-height:1.1;background:rgba(255,250,240,.6);flex:none}
/* HUD */
#hud{flex:none;padding:8px 8px 6px;background:#fff6e6;border-bottom:2px solid #e3c9a3;display:flex;flex-direction:column;gap:5px;z-index:3}
.row{display:flex;gap:6px;align-items:center}
.pill{flex:1;display:flex;align-items:center;gap:5px;background:#fffaf0;border:2px solid #e3c9a3;border-radius:14px;padding:3px 7px;font-weight:800;font-size:14px;min-width:0}
.pill span{flex:1;text-align:right;white-space:nowrap}.pill small{font-size:10px;color:#9b7b57;font-weight:700}
.bar{height:8px;border-radius:5px;background:#ead8b8;overflow:hidden;flex:1}.bar i{display:block;height:100%;background:#f0a64a;border-radius:5px}
#lvl{font-weight:900;font-size:13px;white-space:nowrap}#rep{font-weight:800;font-size:12px;white-space:nowrap}#mgr{font-size:11px;font-weight:800;color:#5b7a3a;white-space:nowrap}
/* scene */
#scene{flex:1;min-height:0;position:relative;overflow:hidden;background:#f7e6cc;touch-action:none}
#closed{position:absolute;inset:0;background:rgba(40,25,10,.55);color:#fff;font-weight:900;font-size:22px;display:flex;align-items:center;justify-content:center;z-index:6}
.pop{position:absolute;font-weight:900;font-size:12px;color:#7a3f12;background:#fffaf0;border-radius:8px;padding:1px 5px;pointer-events:none;z-index:8;animation:pop 1.4s forwards}
.pop img{width:22px;height:22px;vertical-align:middle;margin-right:2px}
@keyframes pop{0%{opacity:0}15%{opacity:1}80%{opacity:1}100%{opacity:0}}
/* sheets */
#panel{position:absolute;left:0;right:0;bottom:0;top:0;background:#fff8ec;z-index:10;display:flex;flex-direction:column}
#phead{display:flex;align-items:center;gap:8px;padding:10px;border-bottom:2px solid #e3c9a3;background:#fff1da}#phead h2{flex:1;margin:0;font-size:18px}
#pbody{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:10px}
.card{background:#fffdf7;border:2px solid #ecd8b8;border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:7px}
.card h3{margin:0;font-size:15px}.note{font-size:11px;color:#8a6a4a;font-weight:600}
.li{display:flex;align-items:center;gap:8px}.li .grow{flex:1;min-width:0}.li>img{width:34px;height:34px;flex:none}.li .nm{font-weight:900;font-size:14px}.li .sub{font-size:11px;color:#8a6a4a}
.pt{width:54px;height:54px;border-radius:12px;overflow:hidden;background:#fff;flex:none;border:2px solid #ecd8b8}.pt img{width:100%;height:100%;object-fit:cover;object-position:50% 30%}
.big{width:170px;height:170px;border-radius:20px;overflow:hidden;background:#fff;margin:0 auto;border:3px solid #ecd8b8}.big img{width:100%;height:100%;object-fit:cover;object-position:50% 35%}
.g{display:grid;grid-template-columns:86px 1fr 32px;gap:6px;align-items:center;font-size:12px;font-weight:800}.g .bar{height:10px}
.btns{display:flex;flex-wrap:wrap;gap:6px}.btns button{font-size:12px;padding:7px 8px;display:inline-flex;align-items:center;gap:4px}
.btns button img{width:20px;height:20px}
.trk{display:flex;flex-direction:column;gap:4px;padding:6px 0;border-top:1px dashed #ecd8b8;font-size:13px}.trk .stars{font-size:15px}
.banner{border-radius:12px;overflow:hidden}.banner img{width:100%;display:block}
.stars{color:#e6a531;letter-spacing:-1px}
/* §15 CSS paper and ruled rows; no reference artwork. */
#mbox.ledger-paper{background:#faf4df;border:1px solid #cabc99;border-radius:5px;color:#453a2c;gap:10px;padding:22px 18px;box-shadow:0 9px 28px #251b1455}
.ledger-title{display:flex;align-items:center;justify-content:space-between}.ledger-title h2{flex:1}.ledger-title button{padding:2px 9px;background:transparent;color:#635440;box-shadow:none;font-size:24px}
.ledger-days{display:flex;justify-content:center;gap:8px}.ledger-days button{background:#e5d9bb;color:#51452f;box-shadow:none;padding:7px 24px}.ledger-days button[aria-pressed=true]{background:#6e7754;color:white}
.ledger-unit{text-align:right;color:#7b705e}.ledger-section h3{font-size:13px;margin:6px 0}.ledger-row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #d6cbaa;padding:10px 0;font-size:12px;font-variant-numeric:tabular-nums}.ledger-row.expense{color:#ac3e36}.ledger-net{border-top:2px solid #97896a;border-bottom:0;margin-top:8px;font-size:15px}
/* modal */
#modal{position:absolute;inset:0;background:rgba(40,25,10,.5);z-index:20;display:flex;align-items:center;justify-content:center;padding:18px}
#mbox{background:#fff8ec;border-radius:18px;padding:16px;width:100%;max-height:92%;overflow:auto;display:flex;flex-direction:column;gap:10px;box-shadow:0 6px 20px rgba(0,0,0,.3)}
#mbox h2{margin:0;font-size:19px;text-align:center}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choice{background:#fffdf7;border:3px solid #ecd8b8;border-radius:14px;padding:6px;color:#4a2e1c;box-shadow:none;display:flex;flex-direction:column;align-items:center;gap:4px}
.choice.on{border-color:#f0a64a;background:#fff1da}.choice img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}
.band{display:inline-block;width:60px;height:40px;border-radius:8px;background-repeat:no-repeat;background-size:300% 300%;background-color:#fbefd9;flex:none;border:2px solid #ecd8b8}
.band.sm{width:42px;height:28px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}.tabs button{font-size:11px;padding:5px 7px}
.accgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.accgrid .ai{display:flex;flex-direction:column;align-items:center;gap:3px;background:#fffaf0;border:2px solid #ecd8b8;border-radius:10px;padding:5px 3px;font-size:10px;font-weight:800;text-align:center}
.accgrid .ai .band{width:100%;height:auto;aspect-ratio:3/2;border:0}.accgrid .ai button{font-size:10px;padding:4px 6px}
.gres{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.gres .gi{display:flex;flex-direction:column;align-items:center;font-size:9px;font-weight:800;text-align:center;line-height:1.15}
.gres .gi img{width:100%;aspect-ratio:1;object-fit:cover;object-position:50% 30%;border-radius:10px;border:2px solid #f0a64a;background:#fff}.gres .gi.dup img{border-color:#ecd8b8;opacity:.8}
input[type=text]{font:inherit;font-size:15px;padding:8px;border-radius:10px;border:2px solid #e3c9a3;width:100%}
#toast{position:absolute;left:50%;top:96px;transform:translateX(-50%);background:#4a2e1c;color:#fff;font-weight:800;font-size:13px;padding:7px 12px;border-radius:12px;z-index:30;pointer-events:none;transition:opacity .3s;max-width:90%;text-align:center}

#scene{flex:none;height:calc(55% - 94px);background:#e9eddf}#isomap{width:100%;height:100%;display:block;touch-action:none}
#mainMenu{flex:1;min-height:0;display:flex;flex-direction:column;background:#fffaf0;border-radius:20px 20px 0 0;z-index:2;box-shadow:0 -3px 10px #67765915}.main-tabs{display:flex;padding:10px 12px 0;gap:5px;border-bottom:1px solid #e5dac6}.main-tabs button{flex:1;background:transparent;color:#95856c;border-radius:10px 10px 0 0;box-shadow:none;font-size:13px;padding:10px}.main-tabs .active{background:#e7b65c;color:#533b22}.menu-heading{padding:12px 15px 8px;font-size:15px;font-weight:900}.menu-heading small{float:right;font-size:10px;font-weight:500;color:#a08b70;margin-top:4px}#menuList{overflow:auto;padding:0 12px 12px;flex:1;min-height:0}.menu-card{display:flex;align-items:center;gap:9px;border:1px solid #e9decb;border-radius:13px;background:#fffdf7;padding:8px;margin-bottom:7px;min-height:98px}.menu-card>img{width:64px;height:64px;object-fit:contain;border-radius:9px}.menu-info{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}.menu-info small{font-size:8px;color:#ad9777}.menu-info strong{font-size:12px}.menu-info span{font-size:9px;color:#947f62}.menu-action{width:75px;text-align:center;font-size:9px;color:#aa9273}.menu-action button{font-size:10px;padding:7px;line-height:1.5}.preparing{text-align:center;padding:55px;color:#ad9777}#panel{bottom:0}#pbody{min-height:0}#pbody>.card{flex-shrink:0}.gear{flex:none;width:30px;height:32px;padding:4px;background:transparent;box-shadow:none;color:#826b4e}.gear svg{width:22px;height:22px;display:block}.menu-action{width:90px}


#scene{height:calc(55% - 89px)}
#panel{top:calc(55% + 50px);bottom:0;border-radius:16px 16px 0 0}#pbody{min-height:0;padding-bottom:20px}
#settingsGear{flex:none;width:30px;padding:3px;background:transparent;color:#806b4d;box-shadow:none}
.main-tabs{padding:8px 10px 5px;flex:none}.main-tabs button{background:url(assets/drive/ui/ui-tab-default.png) center/100% 100% no-repeat;padding:9px 0;color:#745537}.main-tabs button.active{background-image:url(assets/drive/ui/ui-tab-selected.png)}
.menu-heading{padding:6px 12px;font-size:13px}#menuList{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:4px 10px 18px;align-content:start;grid-auto-rows:154px}
.menu-card{position:relative;display:flex;flex-direction:column;gap:3px;aspect-ratio:180/230;min-height:0;margin:0;padding:10px 6px 9px;border:0;border-radius:0;background:url(assets/drive/ui/ui-card-default.png) center/100% 100% no-repeat}
.menu-card.locked{background-image:url(assets/drive/ui/ui-card-locked.png)}.menu-card>img{width:54px;height:54px;flex:none}.menu-info{width:100%;align-items:center;gap:3px;flex:1}.menu-info strong{font-size:10px;white-space:nowrap}.menu-info span{font-size:8px}.menu-action{width:100%;font-size:9px;min-height:25px;display:flex;align-items:center;justify-content:center;gap:3px}.menu-action .lock{width:16px;height:16px}
.menu-action button{width:100%;height:29px;padding:0;font-size:9px;color:#fff;box-shadow:none;border-radius:0;background:url(assets/drive/ui/ui-btn-develop-green.png) center/100% 100% no-repeat}.menu-action button.instant{background-image:url(assets/drive/ui/ui-btn-diamond-purple.png);font-size:8px}.menu-action button:disabled{filter:grayscale(1);opacity:.55}
button[data-act=levelUp]{background:url(assets/drive/ui/ui-btn-levelup-yellow.png) center/100% 100% no-repeat;box-shadow:none;color:#65421d;min-width:130px;min-height:40px}
#menuList.tab-list{display:flex;flex-direction:column}.furniture-actions{display:flex;gap:6px;flex-wrap:wrap;padding:8px 0}.furniture-actions[hidden]{display:none}.furniture-actions button{font-size:12px;padding:8px}
.furniture-section{flex-shrink:0;min-width:0}.furniture-section h3{margin:2px 0 6px;font-size:12px}
.furniture-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.furniture-card{aspect-ratio:1;min-width:0;overflow:hidden;display:grid;grid-template-rows:minmax(0,1fr) auto;justify-items:center;gap:2px;padding:7px 5px;background:url(assets/drive/ui/ui-card-default.png) center/100% 100% no-repeat;text-align:center}
.furniture-card .furniture-icon{width:100%;height:100%;min-height:0;object-fit:contain;object-position:center}
.furniture-card strong{max-width:100%;font-size:10px;line-height:1.2;white-space:nowrap}

/* Unit 5: reserve bottom area inside every menu card. */
#menuList:not(.tab-list){grid-auto-rows:180px}.menu-card{aspect-ratio:auto;min-height:0;height:100%;padding-bottom:12px;box-sizing:border-box}.menu-info{flex:none}.menu-action{margin-top:auto;flex-shrink:0;min-height:30px}.menu-action button{max-width:100%;box-sizing:border-box}.menu-action button.instant{width:70%;height:21px;font-size:7px;white-space:nowrap}
#toast{white-space:nowrap;font-size:12px}

/* §14 supplement: compact portrait HUD overlays the map without reserving space. */
#hud{position:absolute;inset:0 0 auto;padding:5px 6px;gap:3px;background:transparent;border:0;pointer-events:none}
#hud .resources{gap:4px;flex-wrap:nowrap;pointer-events:auto}
#hud .pill{display:flex;flex:1;min-width:0;height:26px;gap:3px;padding:3px 5px;border:0;border-radius:999px;background:rgba(37,32,30,.76);color:#fff;box-shadow:none;font-size:10px;line-height:1;font-weight:800}
#hud .pill span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums}
/* Resource icons: the pre-§14 HUD shapes (6ac0bdd), until 그림이 icons arrive. */
#hud .resource{position:relative;display:block;flex:none;width:15px;height:15px}
#hud .resource.coin{border-radius:50%;background:#e8b64e;border:2px solid #be8a2f}
#hud .resource.heart{background:#d8817a;transform:rotate(-45deg);width:11px;height:11px;margin:3px 2px 0}
#hud .resource.heart:before,#hud .resource.heart:after{content:'';position:absolute;width:11px;height:11px;border-radius:50%;background:inherit}#hud .resource.heart:before{top:-5px;left:0}#hud .resource.heart:after{left:5px;top:0}
#hud .resource.diamond{background:#82bfc2;clip-path:polygon(25% 0,75% 0,100% 35%,50% 100%,0 35%)}
#hud .resource.paw{background:#ac9476;border-radius:60% 60% 45% 45%;width:12px;height:10px;margin:5px 1px 0 2px}
#hud .resource.paw:before{content:'';position:absolute;width:5px;height:5px;background:inherit;border-radius:50%;left:-2px;top:-6px;box-shadow:6px -2px #ac9476,12px 0 #ac9476}
#hud .pill-open{display:flex;flex:1;align-items:center;gap:3px;min-width:0;height:100%;padding:0;margin:0;border-radius:999px;background:transparent;color:inherit;box-shadow:none;font:inherit;line-height:1}
#hud .resource-add{flex:none;width:18px;height:18px;margin-right:-2px;padding:0;border-radius:50%;background:#f0a64a;color:#fff;box-shadow:none;font-size:14px;line-height:18px}
#hud .cafe-status{gap:6px;height:24px;justify-content:flex-end}
.cafe-progress{display:flex;align-items:center;gap:0;margin-right:auto;pointer-events:auto}
#lvl{display:flex;align-items:center;justify-content:center;width:24px;height:24px;flex:none;border-radius:50%;background:#58452be6;color:#fff;font-size:7px;white-space:normal;text-align:center;line-height:1.1;z-index:1}
#cafeExp{flex:none;width:54px;height:6px;margin-left:-2px;background:#25201ecc}#expBar{background:#edc671}
#rep{font-size:10px;padding:3px 6px;border-radius:999px;background:#25201ecc;color:#fff;pointer-events:auto}
#hud .gear{width:30px;height:24px;padding:0;background:#25201ecc;color:#fff;font-size:9px;border-radius:999px;box-shadow:none;pointer-events:auto}
#hud button:focus-visible{outline:2px solid #ffd77b;outline-offset:2px}
#scene{height:calc(55% - 20px)}

</style>
<div id="app">
 <div id="hud" aria-label="카페 자원">
  <div class="row resources" aria-label="재화">
   <div class="pill"><button class="pill-open" data-act="income" aria-label="멍코인 · 손익계산서"><i class="resource coin" aria-hidden="true"></i><span id="coins"></span></button><button class="resource-add" data-act="resourceShop" aria-label="멍코인 상점 열기">+</button></div>
   <div class="pill" aria-label="하트"><i class="resource heart" aria-hidden="true"></i><span id="hearts"></span></div>
   <div class="pill"><span class="pill-open" aria-label="다이아"><i class="resource diamond" aria-hidden="true"></i><span id="dia"></span></span><button class="resource-add" data-act="resourceShop" aria-label="다이아 상점 열기">+</button></div>
   <div class="pill" aria-label="발바닥"><i class="resource paw" aria-hidden="true"></i><span id="paws"></span></div>
  </div>
  <div class="row cafe-status"><div class="cafe-progress"><span id="lvl"></span><div class="bar" id="cafeExp" role="progressbar" aria-label="카페 경험치"><i id="expBar"></i></div></div><span id="rep"></span><span id="mgr" hidden></span><small id="heartT" hidden></small><button class="gear" data-nav="settings" aria-label="설정">설정</button></div>
 </div>
 <div id="scene"><canvas id="isomap" aria-label="다다미 카페 지도 · 드래그하여 이동"></canvas><div id="closed" hidden></div></div>
 <section id="mainMenu"><div class="main-tabs"><button data-main-tab="menu" class="active">메뉴</button><button data-main-tab="shiba">시바</button><button data-main-tab="furniture">가구</button><button data-main-tab="store">가게</button></div><div class="menu-heading">메뉴 개발 <small>새로운 맛을 준비해요</small></div><div id="menuList"></div></section>
 <div id="panel" hidden><div id="phead"><h2 id="ptitle"></h2><button class="sec" data-act="close" data-i18n="app.close"></button></div><div id="pbody"></div></div>
 <div id="modal" hidden><div id="mbox"></div></div>
 <div id="toast" style="opacity:0"></div>
</div>
