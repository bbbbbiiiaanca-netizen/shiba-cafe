<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"><link rel="icon" href="data:,"><title>시바카페</title>
<style>
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#3b2618;font-family:"Noto Sans CJK KR","Apple SD Gothic Neo",sans-serif;color:#4a2e1c;-webkit-user-select:none;user-select:none}
#app{position:fixed;inset:0;max-width:430px;margin:0 auto;background:#f3e3c4;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;font-weight:800;border:0;border-radius:12px;background:#f0a64a;color:#fff;padding:7px 10px;box-shadow:0 2px 0 #b8742a;cursor:pointer}
button:disabled{background:#d6c7b3;color:#8a7763;box-shadow:0 2px 0 #b3a28c;cursor:default}
button.sec{background:#fffaf0;color:#6b4426;border:2px solid #e3c9a3;box-shadow:none}
button.warn{background:#d9695a;box-shadow:0 2px 0 #9c4136}
.ico{display:inline-block;width:22px;height:22px;border-radius:6px;background-image:url(assets/drive/icons-final-check.jpg);background-size:500% 100%;vertical-align:middle;flex:none}
.ico.reset{background-position:0 0}.ico.heart{background-position:25% 0}.ico.paw{background-position:50% 0}.ico.dia{background-position:75% 0}
.slot{display:inline-flex;align-items:center;justify-content:center;border:2px dashed #b99a74;border-radius:8px;color:#9b7b57;font-size:9px;font-weight:700;text-align:center;line-height:1.1;background:rgba(255,250,240,.6);flex:none}
/* HUD */
#hud{flex:none;padding:8px 8px 6px;background:#fff6e6;border-bottom:2px solid #e3c9a3;display:flex;flex-direction:column;gap:5px;z-index:3}
.row{display:flex;gap:6px;align-items:center}
.pill{flex:1;display:flex;align-items:center;gap:5px;background:#fffaf0;border:2px solid #e3c9a3;border-radius:14px;padding:3px 7px;font-weight:800;font-size:14px;min-width:0}
.pill span{flex:1;text-align:right;white-space:nowrap}.pill small{font-size:10px;color:#9b7b57;font-weight:700}
.bar{height:8px;border-radius:5px;background:#ead8b8;overflow:hidden;flex:1}.bar i{display:block;height:100%;background:#f0a64a;border-radius:5px}
#lvl{font-weight:900;font-size:13px;white-space:nowrap}#rep{font-weight:800;font-size:12px;white-space:nowrap}#mgr{font-size:11px;font-weight:800;color:#5b7a3a;white-space:nowrap}
/* scene */
#scene{flex:1;min-height:0;position:relative;overflow:hidden;background:#f7e6cc;touch-action:none}
#closed{position:absolute;inset:0;background:rgba(40,25,10,.55);color:#fff;font-weight:900;font-size:22px;display:flex;align-items:center;justify-content:center;z-index:6}
.pop{position:absolute;font-weight:900;font-size:12px;color:#7a3f12;background:#fffaf0;border-radius:8px;padding:1px 5px;pointer-events:none;z-index:8;animation:pop 1.4s forwards}
.pop img{width:22px;height:22px;vertical-align:middle;margin-right:2px}
@keyframes pop{0%{opacity:0}15%{opacity:1}80%{opacity:1}100%{opacity:0}}
/* nav */
#nav{flex:none;height:62px;display:flex;gap:4px;padding:6px 6px 8px;background:#fff6e6;border-top:2px solid #e3c9a3}
#nav button{flex:1;padding:8px 2px;font-size:13px}#nav button.on{background:#c97a2b}
/* sheets */
#panel{position:absolute;left:0;right:0;bottom:62px;top:0;background:#fff8ec;z-index:10;display:flex;flex-direction:column}
#phead{display:flex;align-items:center;gap:8px;padding:10px;border-bottom:2px solid #e3c9a3;background:#fff1da}#phead h2{flex:1;margin:0;font-size:18px}
#pbody{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:10px}
.card{background:#fffdf7;border:2px solid #ecd8b8;border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:7px}
.card h3{margin:0;font-size:15px}.note{font-size:11px;color:#8a6a4a;font-weight:600}
.li{display:flex;align-items:center;gap:8px}.li .grow{flex:1;min-width:0}.li>img{width:34px;height:34px;flex:none}.li .nm{font-weight:900;font-size:14px}.li .sub{font-size:11px;color:#8a6a4a}
.pt{width:54px;height:54px;border-radius:12px;overflow:hidden;background:#fff;flex:none;border:2px solid #ecd8b8}.pt img{width:100%;height:100%;object-fit:cover;object-position:50% 30%}
.big{width:170px;height:170px;border-radius:20px;overflow:hidden;background:#fff;margin:0 auto;border:3px solid #ecd8b8}.big img{width:100%;height:100%;object-fit:cover;object-position:50% 35%}
.g{display:grid;grid-template-columns:86px 1fr 32px;gap:6px;align-items:center;font-size:12px;font-weight:800}.g .bar{height:10px}
.btns{display:flex;flex-wrap:wrap;gap:6px}.btns button{font-size:12px;padding:7px 8px;display:inline-flex;align-items:center;gap:4px}
.btns button img{width:20px;height:20px}
.trk{display:flex;flex-direction:column;gap:4px;padding:6px 0;border-top:1px dashed #ecd8b8;font-size:13px}.trk .stars{font-size:15px}
.banner{border-radius:12px;overflow:hidden}.banner img{width:100%;display:block}
.stars{color:#e6a531;letter-spacing:-1px}
/* modal */
#modal{position:absolute;inset:0;background:rgba(40,25,10,.5);z-index:20;display:flex;align-items:center;justify-content:center;padding:18px}
#mbox{background:#fff8ec;border-radius:18px;padding:16px;width:100%;max-height:92%;overflow:auto;display:flex;flex-direction:column;gap:10px;box-shadow:0 6px 20px rgba(0,0,0,.3)}
#mbox h2{margin:0;font-size:19px;text-align:center}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choice{background:#fffdf7;border:3px solid #ecd8b8;border-radius:14px;padding:6px;color:#4a2e1c;box-shadow:none;display:flex;flex-direction:column;align-items:center;gap:4px}
.choice.on{border-color:#f0a64a;background:#fff1da}.choice img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}
.band{display:inline-block;width:60px;height:40px;border-radius:8px;background-repeat:no-repeat;background-size:300% 300%;background-color:#fbefd9;flex:none;border:2px solid #ecd8b8}
.band.sm{width:42px;height:28px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}.tabs button{font-size:11px;padding:5px 7px}
.accgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.accgrid .ai{display:flex;flex-direction:column;align-items:center;gap:3px;background:#fffaf0;border:2px solid #ecd8b8;border-radius:10px;padding:5px 3px;font-size:10px;font-weight:800;text-align:center}
.accgrid .ai .band{width:100%;height:auto;aspect-ratio:3/2;border:0}.accgrid .ai button{font-size:10px;padding:4px 6px}
.gres{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.gres .gi{display:flex;flex-direction:column;align-items:center;font-size:9px;font-weight:800;text-align:center;line-height:1.15}
.gres .gi img{width:100%;aspect-ratio:1;object-fit:cover;object-position:50% 30%;border-radius:10px;border:2px solid #f0a64a;background:#fff}.gres .gi.dup img{border-color:#ecd8b8;opacity:.8}
input[type=text]{font:inherit;font-size:15px;padding:8px;border-radius:10px;border:2px solid #e3c9a3;width:100%}
#toast{position:absolute;left:50%;top:96px;transform:translateX(-50%);background:#4a2e1c;color:#fff;font-weight:800;font-size:13px;padding:7px 12px;border-radius:12px;z-index:30;pointer-events:none;transition:opacity .3s;max-width:90%;text-align:center}

#hud{padding:10px 10px 8px;gap:8px;border:0;background:#fffaf0}
.resources{gap:5px}.pill{position:relative;display:grid;grid-template-columns:18px 1fr;gap:2px;padding:6px;border:1px solid #e5d8bf;border-radius:11px;font-size:12px;background:#f6efdf}.pill small{font-size:8px}.pill span{grid-column:2;text-align:left}.resource{grid-row:1/3;width:15px;height:15px;display:block;position:relative;align-self:center}.coin{border-radius:50%;background:#e8b64e;border:2px solid #be8a2f}.heart{background:#d8817a;transform:rotate(-45deg);width:11px;height:11px;margin-left:2px}.heart:before,.heart:after{content:'';position:absolute;width:11px;height:11px;border-radius:50%;background:inherit}.heart:before{top:-5px}.heart:after{left:5px}.diamond{background:#82bfc2;clip-path:polygon(25% 0,75% 0,100% 35%,50% 100%,0 35%)}.paw{background:#ac9476;border-radius:60% 60% 45% 45%;width:12px;height:10px;margin-top:5px}.paw:before{content:'';position:absolute;width:5px;height:5px;background:inherit;border-radius:50%;left:-2px;top:-6px;box-shadow:6px -2px #ac9476,12px 0 #ac9476}
#scene{flex:none;height:calc(55% - 77px);background:#e9eddf}#isomap{width:100%;height:100%;display:block;touch-action:none}.map-caption{position:absolute;top:13px;left:15px;font-size:14px;font-weight:900;pointer-events:none}.map-caption small{display:block;font-size:9px;color:#7c8970;margin-top:3px}.placeholder-note{position:absolute;bottom:9px;left:15px;font-size:9px;color:#78836a;pointer-events:none}
#mainMenu{flex:1;min-height:0;display:flex;flex-direction:column;background:#fffaf0;border-radius:20px 20px 0 0;z-index:2;box-shadow:0 -3px 10px #67765915}.main-tabs{display:flex;padding:10px 12px 0;gap:5px;border-bottom:1px solid #e5dac6}.main-tabs button{flex:1;background:transparent;color:#95856c;border-radius:10px 10px 0 0;box-shadow:none;font-size:13px;padding:10px}.main-tabs .active{background:#e7b65c;color:#533b22}.menu-heading{padding:12px 15px 8px;font-size:15px;font-weight:900}.menu-heading small{float:right;font-size:10px;font-weight:500;color:#a08b70;margin-top:4px}#menuList{overflow:auto;padding:0 12px 12px;flex:1;min-height:0}.menu-card{display:flex;align-items:center;gap:9px;border:1px solid #e9decb;border-radius:13px;background:#fffdf7;padding:8px;margin-bottom:7px;min-height:98px}.menu-card>img{width:64px;height:64px;object-fit:contain;border-radius:9px}.menu-info{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}.menu-info small{font-size:8px;color:#ad9777}.menu-info strong{font-size:12px}.menu-info span{font-size:9px;color:#947f62}.menu-action{width:75px;text-align:center;font-size:9px;color:#aa9273}.menu-action button{font-size:10px;padding:7px;line-height:1.5}.preparing{text-align:center;padding:55px;color:#ad9777}#nav{height:28px;padding:3px 7px;border:0}#nav button{font-size:9px;padding:2px;background:transparent;color:#9d8a70;box-shadow:none}#nav button.on{background:#eee3cf}#panel{bottom:28px}
</style>
<div id="app">
 <div id="hud"><div class="row resources">
 <div class="pill" data-act="income"><i class="resource coin"></i><small>멍코인</small><span id="coins"></span></div>
 <div class="pill"><i class="resource heart"></i><small>하트</small><span id="hearts"></span></div>
 <div class="pill"><i class="resource diamond"></i><small>다이아</small><span id="dia"></span></div>
 <div class="pill"><i class="resource paw"></i><small>발바닥</small><span id="paws"></span></div>
 </div><div class="row"><span id="lvl"></span><div class="bar"><i id="expBar"></i></div><span id="rep"></span><span id="mgr"></span><small id="heartT" hidden></small></div></div>
 <div id="scene"><canvas id="isomap" aria-label="다다미 카페 지도 · 드래그하여 이동"></canvas><div class="map-caption">다다미 카페 <small>1F · 드래그로 이동</small></div><div class="placeholder-note">가구 · 캐릭터: 임시 도형</div><div id="closed" hidden></div></div>
 <section id="mainMenu"><div class="main-tabs"><button data-main-tab="menu" class="active">메뉴</button><button data-main-tab="shiba">시바</button><button data-main-tab="furniture">가구</button><button data-main-tab="store">가게</button></div><div class="menu-heading">메뉴 개발 <small>새로운 맛을 준비해요</small></div><div id="menuList"></div></section>
 <div id="nav">
  <button data-nav="cafe" class="on" data-i18n="nav.cafe"></button><button data-nav="shibas" data-i18n="nav.shibas"></button><button data-nav="walk" data-i18n="nav.walk"></button><button data-nav="shop" data-i18n="nav.shop"></button><button data-nav="settings" data-i18n="nav.settings"></button>
 </div>
 <div id="panel" hidden><div id="phead"><h2 id="ptitle"></h2><button class="sec" data-act="close" data-i18n="app.close"></button></div><div id="pbody"></div></div>
 <div id="modal" hidden><div id="mbox"></div></div>
 <div id="toast" style="opacity:0"></div>
</div>
<script type="module" src="./main.js"></script>
</html>
